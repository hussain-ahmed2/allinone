# Local development stack for allinone (NOT production).
#   docker compose up -d     — start Postgres + Mongo
#   docker compose down      — stop (data persists in named volumes)
#   docker compose down -v   — stop and wipe data
#
# Mapping to .env.example:
#   DATABASE_URL    → postgres://postgres:testpass@localhost:5432/allinone (db)
#   MONGO_URL       → mongodb://localhost:27017
#   POSTGRES_TEST_URL → postgres://postgres:testpass@localhost:5433/allinone_test
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: allinone
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=100"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: allinone_test
    ports:
      - "5433:5432"
    profiles: ["test"]
    volumes:
      - pgtestdata:/var/lib/postgresql/data

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  pgtestdata:
  mongodata:
